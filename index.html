<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark light; }
  /* --- Project Epoch "druidish" styling --- */
  body {
    background: radial-gradient(1200px 900px at 10% 0%, rgba(16,185,129,.10), transparent 60%),

                linear-gradient(180deg, #07130b, #0a1110 60%, #060a08);

  .card { border-radius: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,.4); padding: 1.25rem; background: rgba(255,255,255,.7); }

  }
  .brand-badge {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: rgba(6,95,70,.9);
  }
  .cta {
    border-radius: .75rem; color: white; padding: .625rem 1.25rem; font-weight: 500; box-shadow: 0 2px 4px rgba(0,0,0,.3);
    background: linear-gradient(180deg, #059669, #047857);
  }
  .cta:hover { filter: brightness(1.05); }
  .cta:active { filter: brightness(0.95); }
  details > summary { cursor: pointer; }
  thead tr { border-bottom: 1px solid rgba(5,150,105,.3); }
  tbody tr { border-bottom: 1px dashed rgba(5,150,105,.25); }
  th, td { vertical-align: middle; padding: .25rem .5rem; }
